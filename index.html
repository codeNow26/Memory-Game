<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory App</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Karla:ital,wght@0,200..800;1,200..800&family=Red+Rose:wght@300..700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Fira+Code:wght@300..700&family=Karla:ital,wght@0,200..800;1,200..800&family=Red+Rose:wght@300..700&display=swap"
        rel="stylesheet">

</head>

<body>
    <section id="start-screen" class="start-screen">
        <div class="start-screen-content">
            <h2>It´s play time.</h2>
            <h1 id="h1_hallo">Ready to play?</h1>
            <div class="start-btn-container">
                <button id="start-btn" class="start-btn">
                    <img class="start-controller" src="./src/images/stadia_controller.png" alt="">
                    <span>Play</span>
                    <img class="start-arrow" src="./src/images/Arrow 1.png" alt="">
                    <img class="start-arrow-hover" src="./src/images/Arrow-hover.png" alt="">
                </button>
            </div>
        </div>
        <img class="start-screen-img" src="./src/images/stadia_controller_rotate.png" alt="">
    </section>



    <section id="settings-screen" class="settings-screen d-none">
        <h1>Settings</h1>
        <img class="settings-underline" src="./src/images/Line 3.png">
        <div class="settings-content">
            <div class="settings-left">

                <div class="category">
                    <div class="category-title">
                        <img class="category-icon" src="./src/images/icons/palette.png">
                        <h2>Game themes</h2>
                    </div>
                    <div class="category__radio-wrapper theme-options">
                        <label class="radio-option">
                            <input type="radio" name="theme" value="coding" checked> <span>Code vibes theme</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="theme" value="gaming"> <span>Gaming theme</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="theme" value="da"> <span>DA Projects theme</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="theme" value="foods"> <span>Foods theme</span>
                        </label>
                    </div>
                </div>

                <div class="category">
                    <div class="category-title">
                        <img class="category-icon" src="./src/images/icons/chess_pawn.png">
                        <h2>Choose Player</h2>
                    </div>
                    <div class="category__radio-wrapper">
                        <label class="radio-option">
                            <input type="radio" name="player" value="blue" checked> <span>Blue</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="player" value="orange"> <span>Orange</span>
                        </label>
                    </div>
                </div>


                <div class="category">
                    <div class="category-title">
                        <img class="category-icon" src="./src/images/icons/style.png">
                        <h2>Board Size</h2>
                    </div>
                    <div class="category__radio-wrapper">
                        <label class="radio-option">
                            <input type="radio" name="board" value="16" checked><span>16 cards</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="board" value="24"><span>24 cards</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="board" value="36"><span>36 cards</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="settings-right">
                <div class="settings-right-wrapper">
                    <div class="theme-preview">
                        <img class="active" src="./src/images/themes/Theme Visual Code.png" alt="Visual Code Theme">
                        <img src="./src/images/themes/Theme Visual Gaming.png" alt="Gaming Theme">
                        <img src="./src/images/themes/Theme Visual DA.png" alt="DA-Theme">
                        <img src="./src/images/themes/Theme Visual Foods.png" alt="Foods Theme">
                    </div>
                    <div class="selection-overview">
                        <span id="theme" name="theme">Game theme</span>
                        <div class="selection-overview__divider"></div>
                        <span id="player" name="player">Player</span>
                        <div class="selection-overview__divider"></div>
                        <span id="board" name="board">Board size</span>
                        <button id="start-game-btn" class="selection-overview__start-game-btn">
                            <img class="start-icon" src="./src/images/icons/smart_display.png">
                            <span>Start</span>
                        </button>
                    </div>
                </div>
            </div>
    </section>








    <section id="game-screen" class="game-screen d-none">
        <div class="game-wrapper">
            <div class="game-header">
                <div class="game-header__left">
                    <div>
                        <span id="blue-score" class="game-header__score game-header__score--blue">Blue: 0</span>
                        <span id="orange-score" class="game-header__score game-header__score--orange">Orange: 0</span>
                    </div>

                </div>

                <div class="game-header__center">Current player: <span id="current-player"></span></div>
                <div class="game-header__right">
                    <div class="game-header__right-wrapper">
                        <img src="./src/images/icons/exit.png" alt="Exit-Icon">
                        <span>Exit Game</span>
                    </div>
                </div>
            </div>
            <div class="field-wrapper">
                <section id="field" class="field">
                    
        </div>
    </section>
    </section>

    <section id="game-over-screen" class="d-none">

    </section>



    <script type="module" src="./src/main.js"></script>
</body>

</html>
